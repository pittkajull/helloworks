<!doctype html>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0e0e0e; }
  :root {
    --ink: #171717; --paper: #f5f1e9; --acid: #d9f85b; --blue: #1939d5; --flame: #ff5f36;
    --line: rgba(23, 23, 23, .18);

  .canvas {

    padding: 62px 72px 0;

  .brand { display: flex; align-items: center; gap: 16px; }
  .brand .dot { width: 16px; height: 16px; background: var(--blue); border-radius: 3px; flex-shrink: 0; }
  .brand b { font-size: 30px; font-weight: 800; letter-spacing: -.07em; }
  .brand b em { font-style: italic; }
  .brand b i { color: var(--blue); font-style: normal; }
  .top-label {
    font-size: 15px; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(23, 23, 23, .55); text-align: right; line-height: 1.7;
  }
  .top-label b { color: var(--blue); font-weight: 500; }
  .main { position: absolute; left: 72px; right: 72px; top: 240px; }
  .num { font-size: 16px; letter-spacing: .12em; color: var(--blue); }
  .headline {
    margin-top: 28px;
    font-weight: 800; text-transform: uppercase; letter-spacing: -.045em;
    line-height: .84; font-size: 134px;
  }
  .headline .serif { color: var(--blue); letter-spacing: -.02em; }
  .sub {
    margin-top: 46px; max-width: 560px;
    font-size: 25px; line-height: 1.55; font-weight: 600; color: rgba(23, 23, 23, .85);

</html>
