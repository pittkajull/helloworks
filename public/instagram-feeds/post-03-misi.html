<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>HelloWorks · Post 03 — Misi</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0e0e0e; }
  :root {
    --ink: #171717; --paper: #f5f1e9; --acid: #d9f85b; --blue: #1939d5; --flame: #ff5f36;
  }
  .canvas {
    position: relative; width: 1080px; height: 1080px; overflow: hidden;
    margin: 0 auto; background: var(--blue); color: var(--paper);
    font-family: 'Manrope', sans-serif;
  }
  .mono { font-family: 'DM Mono', monospace; }
  .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400; letter-spacing: -.01em; }
  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .05; z-index: 5;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
  }
  .head {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 62px 72px 0;
  }
  .head .label { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: rgba(245, 241, 233, .65); }
  .head .label b { color: var(--acid); font-weight: 500; }
  .head .num { font-size: 15px; color: var(--acid); }
  .main { position: absolute; left: 72px; right: 72px; top: 210px; }
  .headline {
    font-weight: 800; text-transform: uppercase; letter-spacing: -.045em;
    line-height: .86; font-size: 118px;
  }
  .headline .serif { color: var(--acid); letter-spacing: -.02em; }
  .copy {
    margin-top: 48px; max-width: 620px;
    font-size: 24px; line-height: 1.6; font-weight: 500; color: rgba(245, 241, 233, .88);
  }
  .copy b { color: var(--acid); font-weight: 700; }
  .shape {
    position: absolute; right: -140px; top: 300px; width: 460px; height: 460px;
    border: 3px solid rgba(245, 241, 233, .25); border-radius: 50%;
  }
  .shape .in {
    position: absolute; left: 80px; top: 90px; width: 180px; height: 180px;
    background: var(--flame); border-radius: 50%;
  }
  .values {
    position: absolute; left: 72px; right: 72px; bottom: 54px;
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid rgba(245, 241, 233, .25); padding-top: 24px;
  }
  .values .v { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: rgba(245, 241, 233, .7); }
  .values .v b { color: var(--acid); font-weight: 500; }
  .values .star { color: var(--acid); font-size: 20px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="shape"><div class="in"></div></div>

  <div class="head">
    <div class="mono label">Why helloworks — <b>kenapa kami</b></div>
    <div class="mono num">03</div>
  </div>

  <div class="main">
    <h1 class="headline">
      TIM KECIL.<br/>
      <span class="serif">Visi besar.</span>
    </h1>
    <p class="copy">
      Kami percaya <b>setiap ide layak dikembangkan terus-menerus</b> — bukan cuma
      dikerjakan sekali jadi. Detail-oriented, personal, dan passion yang gak main-main:
      tim kecil yang kerja besar.
    </p>
  </div>

  <div class="values">
    <span class="mono v"><b>Detail-oriented</b> — <b>Personal</b> — <b>Never stop building</b></span>
    <span class="mono star">✳</span>
  </div>

  <div class="grain"></div>
</div>
</body>
</html>
