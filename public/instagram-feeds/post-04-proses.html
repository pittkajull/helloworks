<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>HelloWorks · Post 04 — Proses</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0e0e0e; }
  :root {
    --ink: #171717; --paper: #f5f1e9; --acid: #d9f85b; --blue: #1939d5; --flame: #ff5f36;
    --line: rgba(23, 23, 23, .18);
  }
  .canvas {
    position: relative; width: 1080px; height: 1080px; overflow: hidden;
    margin: 0 auto; background: var(--paper); color: var(--ink);
    font-family: 'Manrope', sans-serif;
  }
  .mono { font-family: 'DM Mono', monospace; }
  .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400; letter-spacing: -.01em; }
  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .05; z-index: 5;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
  }
  .head {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 62px 72px 0;
  }
  .head .label { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: rgba(23, 23, 23, .6); }
  .head .label b { color: var(--blue); font-weight: 500; }
  .head .num { font-size: 15px; color: var(--blue); }
  .title {
    position: absolute; left: 72px; right: 72px; top: 150px;
    font-weight: 800; text-transform: uppercase; letter-spacing: -.045em;
    line-height: .84; font-size: 88px;
  }
  .title .serif { color: var(--blue); letter-spacing: -.02em; }
  .note {
    position: absolute; left: 72px; top: 340px;
    font-size: 18px; color: rgba(23, 23, 23, .62); font-weight: 500;
  }
  .snake { position: absolute; left: 72px; right: 72px; top: 430px; }
  .row { display: flex; align-items: center; gap: 18px; }
  .row.two { margin-top: 26px; margin-left: 132px; }
  .chip {
    font-size: 18px; letter-spacing: .09em; text-transform: uppercase;
    border: 2px solid var(--ink); padding: 18px 26px; background: var(--paper);
    white-space: nowrap;
  }
  .chip.start { background: var(--acid); }
  .chip.turn { background: var(--blue); color: var(--paper); border-color: var(--blue); }
  .ar { font-size: 26px; color: var(--blue); }
  .ar.dn { font-size: 30px; }
  .loop {
    position: absolute; left: -64px; top: 108px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .loop .ring {
    width: 74px; height: 74px; border: 3px solid var(--blue); border-radius: 50%;
    display: grid; place-items: center; font-size: 40px; color: var(--blue);
    background: var(--paper);
  }
  .loop small { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: rgba(23, 23, 23, .6); white-space: nowrap; }
  .foot {
    position: absolute; left: 72px; right: 72px; bottom: 54px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--line); padding-top: 24px;
    font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: rgba(23, 23, 23, .6);
  }
  .foot .star { color: var(--blue); font-size: 20px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="head">
    <div class="mono label">How we work — <b>continuous product cycle</b></div>
    <div class="mono num">04</div>
  </div>

  <h1 class="title">PRODUK GAK<br/>PERNAH <span class="serif">selesai.</span></h1>
  <p class="note">Gak ada produk yang beneran selesai — selalu ada ruang buat berkembang.</p>

  <div class="snake">
    <div class="row">
      <span class="chip start">Research</span><span class="ar">→</span>
      <span class="chip">Understand</span><span class="ar">→</span>
      <span class="chip">Design</span><span class="ar">→</span>
      <span class="chip">Build</span><span class="ar dn">↳</span>
    </div>
    <div class="row two">
      <span class="chip">Improve</span><span class="ar">←</span>
      <span class="chip">Learn</span><span class="ar">←</span>
      <span class="chip turn">Launch</span>
    </div>
    <div class="loop">
      <div class="ring">↻</div>
      <small>mulai lagi dari awal</small>
    </div>
  </div>

  <div class="foot">
    <span>helloworks.id — @helloworks_id</span>
    <span class="star">✳</span>
  </div>

  <div class="grain"></div>
</div>
</body>
</html>
