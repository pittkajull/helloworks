<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>HelloWorks · Post 05 — Filosofi</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0e0e0e; }
  :root {
    --ink: #171717; --paper: #f5f1e9; --acid: #d9f85b; --blue: #1939d5; --flame: #ff5f36;
  }
  .canvas {
    position: relative; width: 1080px; height: 1080px; overflow: hidden;
    margin: 0 auto; background: var(--ink); color: var(--paper);
    font-family: 'Manrope', sans-serif;
  }
  .mono { font-family: 'DM Mono', monospace; }
  .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400; letter-spacing: -.01em; }
  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: .07; z-index: 5;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
  }
  .head {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 62px 72px 0;
  }
  .head .label { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: rgba(245, 241, 233, .55); }
  .head .label b { color: var(--acid); font-weight: 500; }
  .head .num { font-size: 15px; color: var(--acid); }
  .quote { position: absolute; left: 72px; right: 72px; top: 210px; }
  .quote .line {
    font-weight: 800; text-transform: uppercase; letter-spacing: -.045em;
    line-height: .9; font-size: 96px;
  }
  .quote .serif { color: var(--acid); letter-spacing: -.02em; }
  .quote .small { font-size: 64px; }
  .sub {
    margin-top: 46px; max-width: 640px;
    font-size: 22px; line-height: 1.6; font-weight: 500; color: rgba(245, 241, 233, .65);
  }
  .sub b { color: var(--acid); font-weight: 700; }
  .foot {
    position: absolute; left: 72px; right: 72px; bottom: 54px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid rgba(245, 241, 233, .22); padding-top: 24px;
    font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: rgba(245, 241, 233, .55);
  }
  .foot .star { color: var(--acid); font-size: 20px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="head">
    <div class="mono label">Philosophy — <b>cara kami melihat teknologi</b></div>
    <div class="mono num">05</div>
  </div>

  <div class="quote">
    <div class="line">WE'RE NOT<br/>BUILDING <span class="serif">software.</span></div>
    <div class="line small" style="margin-top:34px;">WE'RE BUILDING<br/>BETTER <span class="serif">ways to work.</span></div>
    <p class="sub">
      Setiap jam yang dihabiskan buat pekerjaan berulang adalah waktu yang bisa dipakai
      buat <b>menciptakan sesuatu yang lebih bernilai</b>.
    </p>
  </div>

  <div class="foot">
    <span>Never stop building</span>
    <span class="star">✳</span>
  </div>

  <div class="grain"></div>
</div>
</body>
</html>
